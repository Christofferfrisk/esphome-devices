  # --- BUTTONS ---
  # The original Button 1/2 pins (GPIO23/GPIO12) are now DRV8825 DIR/STEP.
  # Their Radio/LP functions use the former Button 3/4 pins instead; the old
  # Button 3/4 seek and physical-calibration actions are intentionally removed.
  - platform: gpio
    id: radio_mode_button
    pin:
      number: GPIO18
      mode: INPUT_PULLUP
      inverted: false
    name: "Radiola Radio Mode Button"
    trigger_on_initial_state: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: register_activity
      - script.execute: enter_radio_mode

  - platform: gpio
    id: lp_mode_button
    pin:
      number: GPIO19
      mode: INPUT_PULLUP
      inverted: false
    name: "Radiola LP Mode Button"
    trigger_on_initial_state: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: register_activity
      - script.execute: enter_lp_mode

  # --- STANDBY CONTACT PLATE ---
  # Plate resting on GND = pin LOW = active/on
  # Plate dialed away from GND = pin HIGH (pullup) = standby
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: false
    name: "Radiola Standby Button"
    id: standby_button
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms
    on_state:
      - lambda: |-
          if (x == id(standby_mode)) {
            ESP_LOGD("radiola", "Standby state unchanged - ignoring");
            return;
          }
          id(standby_mode) = x;
          if (x) {
            id(radio_mode) = false;
            id(lp_mode) = false;
            id(last_dial_mode) = "unknown";
            ESP_LOGI("radiola", "STANDBY MODE: ON");
          } else {
            id(last_user_activity) = millis();
            ESP_LOGI("radiola", "STANDBY MODE: OFF");
          }
          id(standby_transition)->execute(x);
