# --- DIAL MOTOR / ENCODER TUNING ---
substitutions:
  # DRV8825 pins verified against the built circuit board
  dial_step_pin: GPIO12
  dial_dir_pin: GPIO23
  # DRV8825 EN is active-low and internally pulled down. Fit an external 10k
  # pull-up to 3.3V so the coils remain off until the ESP32 configures GPIO13.
  dial_enable_pin: GPIO13
  # Encoder counts (AS5600 = 4096/rev) from a limit where the motor starts resisting
  dial_guard: "150"
  # Encoder counts per motor (micro)step — measure: turn dial N steps, read count delta
  # Measured on the assembled mechanism: Jog -1000 changed the AS5600-derived
  # position by +611 counts (-2379 -> -1768). GPIO23 DIR is inverted below, so
  # positive motor steps move right while encoder counts decrease.
  dial_counts_per_step: "-0.61"
  # Station positions as % of usable dial span
  station_1_pct: "10.0"
  station_2_pct: "36.7"
  station_3_pct: "63.3"
  station_4_pct: "90.0"
  # Snap-to-station: capture radius and "close enough" deadband, in %
  snap_capture_pct: "5.0"
  snap_deadband_pct: "1.0"
  # Fixed DFPlayer volume for all static/noise playback (valid range 0-30).
  # Static intentionally ignores the physical volume knob.
  static_volume: "30"
  # Encoder jitter rejection: counts per 50ms sample that register as real
  # movement, and sustained opposite travel (counts) needed to flip direction
  dial_move_thresh: "5.0"
  dial_dir_hyst: "20.0"
  # Motor motion limits. NOTE: "steps/s" is at the microstep setting of the
  # DRV8825 MODE0-2 jumpers — tune on real hardware, start slow. Gentle
  # acceleration matters most if the pointer runs on a dial cord.
  # Also set the DRV8825 Vref (coil current) as low as reliably moves the
  # pointer: that caps the maximum force the motor can ever exert.
  dial_max_speed: 600 steps/s
  dial_accel: "600"
  # Stall protection: while motion is commanded, the AS5600 must move by at
  # least this many counts within the timeout. Tune after measuring the final
  # microstep ratio; keep the timeout long enough for the acceleration ramp.
  dial_stall_min_counts: "3.0"
  dial_stall_timeout_ms: "750"
  # Calibration must leave this much useful travel after both guard zones.
  dial_min_usable_span: "500.0"

esphome:
  name: radiola1
  friendly_name: radiola
  min_version: 2025.9.0
  name_add_mac_suffix: false
  on_boot:
    # Read the standby plate early so the boot check below and the sensor's
    # initial on_state publication agree on the mode
    - priority: 600
      then:
        - lambda: 'id(standby_mode) = digitalRead(4) == HIGH;'
    - priority: -100
      then:
        # The AS5600 is absolute for one turn only, while dial_pos is a restored
        # multi-turn value. Movement while power is removed cannot be recovered
        # safely, so every boot requires a quick two-end calibration.
        - lambda: |-
            id(dial_needs_cal) = true;
            id(dial_motor).set_target(id(dial_motor).current_position);
            id(dial_motor_enable).turn_off();
            ESP_LOGW("dial", "Boot requires dial calibration: use HA Capture MIN Stop, then Capture MAX Stop");
        - if:
            condition:
              lambda: 'return id(standby_mode);'
            then:
              - logger.log: "Boot in standby — skipping startup sequence"
              - switch.turn_off: radiola_power
            else:
              - logger.log: "ESPHome boot complete — playing startup sound"
              - delay: 800ms  # allow DFPlayer to initialize
              - dfplayer.set_volume: 30
              - dfplayer.play_folder:
                  folder: 1
                  file: 2  # 002.wav
              # --- LED startup sequence ---
              - light.turn_on: radiola_led_1
              - delay: 300ms
              - light.turn_on: radiola_led_2
              - delay: 300ms
              - light.turn_on: radiola_led_3
              - delay: 300ms
              - light.turn_on: radiola_led_4
              - delay: 300ms
              - light.turn_on: radiola_led_5
              - delay: 400ms
              # --- Blink all once ---
              - light.turn_off: radiola_led_1
              - light.turn_off: radiola_led_2
              - light.turn_off: radiola_led_3
              - light.turn_off: radiola_led_4
              - light.turn_off: radiola_led_5
              - delay: 400ms
              - light.turn_on: radiola_led_1
              - light.turn_on: radiola_led_2
              - light.turn_on: radiola_led_3
              - light.turn_on: radiola_led_4
              - light.turn_on: radiola_led_5

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG
  baud_rate: 115200
  # Keep component warnings/errors, but suppress routine sensor publications.
  # The change-driven dial summary below remains visible at INFO level.
  logs:
    ads1115.sensor: WARN
    sensor: WARN

api:
  # An HA restart or briefly-unreachable server must not reboot the device
  # (a reboot forces a full dial recalibration). Hold the session and wait
  # for HA to reconnect instead of self-rebooting after the default 15 min.
  reboot_timeout: 0s

# Bring-up dashboard: live sensors + buttons at http://<device-ip>
web_server:
  port: 80

ota:
  - platform: esphome

# Diagnostics: expose the ESP reset reason (see the "Reset Reason" text_sensor
# below), plus uptime and WiFi signal, so an unexpected reboot — which forces a
# full dial recalibration — is self-explaining in Home Assistant.
debug:
  update_interval: 30s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # A WiFi/AP dropout must not reboot the ESP: the dial and audio work offline,
  # and every reboot wipes the calibration. Keep retrying the connection forever
  # instead of self-rebooting after the default 15 min.
  reboot_timeout: 0s
  fast_connect: true
  manual_ip:
    static_ip: 192.168.31.177
    gateway: 192.168.31.1
    subnet: 255.255.255.0

globals:
  - id: radio_mode
    type: bool
    restore_value: no
    initial_value: "false"
  - id: lp_mode
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_dial_mode
    type: std::string
    restore_value: no
    initial_value: '"unknown"'
  - id: standby_mode
    type: bool
    restore_value: no
    initial_value: "false"
  # After an idle timeout the front-panel LEDs simply dim off (a low-key
  # "screensaver"). Any front-panel interaction lights them again; power, audio
  # and the dial are left running.
  - id: leds_dimmed
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_user_activity
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: idle_audio_stopped
    type: bool
    restore_value: no
    initial_value: "false"
  # --- Dial motor/encoder state ---
  - id: dial_pos          # accumulated multi-turn encoder position, counts
    type: float
    restore_value: yes
    initial_value: "0"
  - id: dial_last_raw     # previous raw AS5600 reading, for wraparound detection
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: dial_min          # soft endstops, encoder counts (set via calibration)
    type: float
    restore_value: yes
    initial_value: "0"
  - id: dial_max
    type: float
    restore_value: yes
    initial_value: "0"
  - id: dial_needs_cal    # true = refuse motor moves until limits recalibrated
    type: bool
    restore_value: no
    initial_value: "true"
  - id: dial_estop        # latched HA emergency stop; cleared only by its reset button
    type: bool
    restore_value: no
    initial_value: "false"
  - id: dial_watchdog_bypass  # temporary bench-test mode; never restored
    type: bool
    restore_value: no
    initial_value: "false"
  - id: cal_stage         # 0 = normal, 1 = waiting for left limit, 2 = right limit
    type: int
    restore_value: no
    initial_value: "0"
  - id: dial_last_move   # millis() of last hand/motor dial movement, for snap settling
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: dial_dir         # last movement direction: +1 right, -1 left
    type: int
    restore_value: no
    initial_value: "1"
  - id: dial_dir_accum   # accumulated counter-direction travel, for hysteresis
    type: float
    restore_value: no
    initial_value: "0"
  - id: dial_move_accum  # signed sub-threshold travel, so slow turns count as movement
    type: float
    restore_value: no
    initial_value: "0"
  - id: encoder_last_ok  # millis() of last valid AS5600 reading, for failsafe
    type: uint32_t
    restore_value: no
    initial_value: "0"

# Persist dial_pos etc. to flash more often than the 1min default,
# so a power pull loses at most ~20s of dial movement
preferences:
  flash_write_interval: 20s

# --- UART for DFPlayer Mini ---
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

# --- DFPlayer Mini ---
dfplayer:
  uart_id: uart_bus
  on_finished_playback:
    then:
      - if:
          condition:
            lambda: |-
              return id(radio_mode) && !id(standby_mode) &&
                     !id(dial_needs_cal) && id(cal_stage) == 0 &&
                     id(dial_mode).state == "noise";
          then:
            - logger.log: "Static finished between stations - restarting"
            - dfplayer.play_folder:
                folder: 1
                file: 1
          else:
            - logger.log: "DFPlayer finished playback"

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 100kHz  # Slower frequency for debugging

# --- ADS1115 External ADC ---
ads1115:
  - address: 0x48
    id: ads1115_hub

# --- AS5600 DIAL ENCODER (I2C, 0x36) ---
# NOTE: must be powered from the always-on 3.3V rail (NOT the PMOS-switched
# rail) so the dial keeps being tracked in standby
as5600:
  id: dial_encoder

# --- DRV8825 STEPPER (linear dial pointer) ---
# ESPHome calls this generic STEP/DIR driver platform "a4988"; it is also
# electrically compatible with a DRV8825.
# EN pin is driven manually (dial_motor_enable) instead of sleep_pin, so we
# control holding torque: coils off = knob spins free, coils on = hard to turn
stepper:
  - platform: a4988
    id: dial_motor
    step_pin: ${dial_step_pin}
    dir_pin:
      number: ${dial_dir_pin}
      inverted: true
    max_speed: ${dial_max_speed}
    acceleration: ${dial_accel}
    deceleration: ${dial_accel}

# --- PN532 NFC READER (I2C) ---
pn532_i2c:
  id: pn532_board
  update_interval: 500ms
  on_tag:
    then:
      - lambda: |-
          ESP_LOGD("nfc", "NFC tag detected: %s", x.c_str());
          id(register_activity)->execute();

# --- LED OUTPUTS (via MOSFETs) ---
output:
  - platform: ledc
    pin: GPIO27
    id: led_1_output
    frequency: 1000Hz

  - platform: ledc
    pin: GPIO25
    id: led_2_output
    frequency: 1000Hz

  - platform: ledc
    pin: GPIO32
    id: led_3_output
    frequency: 1000Hz

  - platform: ledc
    pin: GPIO33
    id: led_4_output
    frequency: 1000Hz

  - platform: ledc
    pin: GPIO26
    id: led_5_output
    frequency: 1000Hz

# --- PMOS Gate (power rail, on/off only — never PWM) ---
switch:
  - platform: gpio
    pin:
      number: GPIO14
      inverted: false
    name: "Radiola Power Rail"
    id: radiola_power
    restore_mode: ALWAYS_ON

  # DRV8825 EN, active-low: switch ON = coils energized
  - platform: gpio
    pin:
      number: ${dial_enable_pin}
      inverted: true
    id: dial_motor_enable
    name: "Dial Motor Coils"
    restore_mode: ALWAYS_OFF

# --- LED LIGHTS (Home Assistant controllable) ---
light:
  - platform: monochromatic
    name: "Radiola LED 1"
    id: radiola_led_1
    output: led_1_output
    gamma_correct: 0
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    name: "Radiola LED 2"
    id: radiola_led_2
    output: led_2_output
    gamma_correct: 0
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    name: "Radiola LED 3"
    id: radiola_led_3
    output: led_3_output
    gamma_correct: 0
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    name: "Radiola LED 4"
    id: radiola_led_4
    output: led_4_output
    gamma_correct: 0
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    name: "Radiola LED 5"
    id: radiola_led_5
    output: led_5_output
    gamma_correct: 0
    restore_mode: ALWAYS_OFF

sensor:
  # Raw AS5600 angle (0-4095), polled fast; accumulates a multi-turn
  # position in dial_pos by detecting wraparound between reads
  - platform: as5600
    as5600_id: dial_encoder
    id: dial_encoder_raw
    internal: true
    update_interval: 50ms
    on_value:
      - lambda: |-
          if (isnan(x)) return;
          id(encoder_last_ok) = millis();
          if (isnan(id(dial_last_raw))) {
            id(dial_last_raw) = x;
            return;
          }
          float d = x - id(dial_last_raw);
          if (d > 2048.0f) d -= 4096.0f;
          else if (d < -2048.0f) d += 4096.0f;
          id(dial_last_raw) = x;
          id(dial_pos) += d;
          // Accumulate signed small deltas. This recognizes a slow deliberate
          // turn without letting alternating encoder jitter look like motion.
          id(dial_move_accum) += d;
          if (fabsf(id(dial_move_accum)) >= ${dial_move_thresh}) {
            float movement = id(dial_move_accum);
            id(dial_move_accum) = 0;
            id(dial_last_move) = millis();
            // Motor-driven snap/park movement is not user activity. A hand
            // turn is, and also wakes an automatically sleeping Radiola.
            if (!id(dial_motor_enable).state)
              id(register_activity)->execute();
            // Direction with hysteresis: movement agreeing with the current
            // direction resets the counter; only sustained opposite travel flips
            if ((movement > 0) == (id(dial_dir) > 0)) {
              id(dial_dir_accum) = 0;
            } else {
              id(dial_dir_accum) += movement;
              if (fabsf(id(dial_dir_accum)) >= ${dial_dir_hyst}) {
                id(dial_dir) = (movement > 0) ? 1 : -1;
                id(dial_dir_accum) = 0;
              }
            }
          }

  - platform: template
    name: "Dial Encoder Position"
    id: dial_encoder_position
    unit_of_measurement: "counts"
    accuracy_decimals: 0
    update_interval: 500ms
    filters:
      - delta: 4.0
    lambda: 'return id(dial_pos);'

  # Dial position as % of the usable span, for the HA dial-face card
  - platform: template
    name: "Dial Position Percent"
    id: dial_position_percent
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 250ms
    filters:
      - delta: 0.3
    lambda: |-
      float lo = id(dial_min) + ${dial_guard};
      float hi = id(dial_max) - ${dial_guard};
      if (lo >= hi || id(dial_needs_cal)) return NAN;
      // Encoder counts increase to the physical left, so invert the displayed
      // percentage: 0% = left end, 100% = right end.
      float p = (hi - id(dial_pos)) / (hi - lo) * 100.0f;
      if (p < 0.0f) p = 0.0f;
      if (p > 100.0f) p = 100.0f;
      return p;

  # Bring-up: raw angle mirror (the 50ms source sensor stays internal)
  - platform: template
    name: "Dial Encoder Raw (debug)"
    unit_of_measurement: "counts"
    accuracy_decimals: 0
    update_interval: 250ms
    filters:
      - delta: 4.0
    lambda: 'return id(dial_last_raw);'

  # --- VOLUME POT ON ADS1115 A1 ---
  - platform: ads1115
    ads1115_id: ads1115_hub
    multiplexer: 'A1_GND'
    gain: 6.144
    name: "Volume Pot Voltage"
    id: vol_pot_voltage
    update_interval: 250ms
    filters:
      - sliding_window_moving_average:
          window_size: 8
          send_every: 1
      - delta: 0.01

  - platform: template
    id: vol_knob_percent
    name: "Radiola Volume Knob"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 250ms
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1
      - delta: 3.0
      - lambda: |-
          return round(x / 2.0f) * 2.0f;
    lambda: |-
      float v = id(vol_pot_voltage).state;
      if (isnan(v)) return NAN;
      const float V_MIN = 0.10f;
      const float V_MAX = 3.10f;
      float x = (v - V_MIN) / (V_MAX - V_MIN);
      if (x < 0.0f) x = 0.0f;
      if (x > 1.0f) x = 1.0f;
      return x * 100.0f;
    on_value:
      then:
        - script.execute: register_activity
        # Store the last physical-knob setting in HA as well. Station changes
        # restore this same helper, so the most recently used control wins.
        - homeassistant.service:
            service: input_number.set_value
            data:
              entity_id: input_number.radiola_card_volume
              value: !lambda 'return x;'
        # Sonos uses its mute state during silent preload, so changing its
        # retained volume here does not make the preload audible.
        - homeassistant.service:
            service: media_player.volume_set
            data:
              entity_id: media_player.kitchen
              volume_level: !lambda 'return x / 100.0f;'

  # --- DIAGNOSTICS (reset reason is a text_sensor further down) ---
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s

# --- DIAL SOFT-ENDSTOP WATCHDOG ---
interval:
  # Dim the front-panel LEDs off after three minutes without a physical
  # interaction. Power, audio, Sonos and the dial keep running; register_activity
  # lights the LEDs again on the next front-panel interaction.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return !id(standby_mode) && !id(leds_dimmed) &&
                     millis() - id(last_user_activity) >= 180000;
          then:
            - lambda: |-
                id(leds_dimmed) = true;
                ESP_LOGI("radiola", "AUTO DIM: 3 minutes without activity - LEDs off");
            - light.turn_off: radiola_led_1
            - light.turn_off: radiola_led_2
            - light.turn_off: radiola_led_3
            - light.turn_off: radiola_led_4
            - light.turn_off: radiola_led_5

  - interval: 100ms
    then:
      - lambda: |-
          static bool stall_was_moving = false;
          static float stall_anchor_error = NAN;
          static float stall_anchor_target = NAN;
          static uint32_t stall_anchor_ms = 0;

          // Emergency stop always wins, including during diagnostic bypass.
          if (id(dial_estop)) {
            id(dial_motor).set_target(id(dial_motor).current_position);
            id(dial_motor_enable).turn_off();
            stall_was_moving = false;
            stall_anchor_error = NAN;
            stall_anchor_target = NAN;
            return;
          }
          // Bench-test bypass suspends encoder, endstop and automatic coil
          // handling. A separate script restores safety after 60 seconds.
          if (id(dial_watchdog_bypass)) return;
          // A calibration lockout must cancel any move that was already
          // running. Returning without this could leave the coils energized.
          if (id(cal_stage) != 0 || id(dial_needs_cal)) {
            id(dial_motor).set_target(id(dial_motor).current_position);
            id(dial_motor_enable).turn_off();
            stall_was_moving = false;
            stall_anchor_error = NAN;
            stall_anchor_target = NAN;
            return;
          }
          // Encoder failsafe: no valid reading for >1s means we are blind —
          // stop the motor and lock out moves until recalibrated
          if (millis() - id(encoder_last_ok) > 1000) {
            id(dial_motor).set_target(id(dial_motor).current_position);
            id(dial_motor_enable).turn_off();
            id(dial_needs_cal) = true;
            ESP_LOGE("dial", "Encoder silent >1s - motor disabled; recalibrate with the HA MIN/MAX buttons");
            return;
          }
          float pos = id(dial_pos);
          float lo = id(dial_min);
          float hi = id(dial_max);
          const float GUARD = ${dial_guard};
          const float CPS = ${dial_counts_per_step};
          if (lo >= hi || fabsf(CPS) < 0.001f) {
            id(dial_motor).set_target(id(dial_motor).current_position);
            id(dial_motor_enable).turn_off();
            id(dial_needs_cal) = true;
            ESP_LOGE("dial", "Invalid dial limits or counts-per-step - motor locked out");
            return;
          }

          bool outside_guard = pos < lo + GUARD || pos > hi - GUARD;
          if (!id(standby_mode) && outside_guard && id(dial_motor).has_reached_target()) {
            // Command spring-back once; repeatedly resetting the reported step
            // position while moving would make the motion rough and ambiguous.
            float margin = std::max((float) ${dial_stall_min_counts}, 2.0f * fabsf(CPS));
            float back = (pos < lo + GUARD) ? (lo + GUARD + margin) : (hi - GUARD - margin);
            id(dial_motor_enable).turn_on();
            id(dial_motor).report_position((int32_t) (pos / CPS));
            id(dial_motor).set_target((int32_t) (back / CPS));
          }

          // Cord-protection watchdog: valid encoder samples are not enough;
          // error to the target must shrink. Wrong-direction travel therefore
          // fails instead of being accepted as proof of movement.
          bool motion_expected = id(dial_motor_enable).state &&
              (!id(dial_motor).has_reached_target() || outside_guard);

          if (!motion_expected) {
            stall_was_moving = false;
            stall_anchor_error = NAN;
            stall_anchor_target = NAN;
            stall_anchor_ms = millis();
          } else {
            float target_counts = (float) id(dial_motor).target_position * CPS;
            float error = fabsf(target_counts - pos);
            bool target_changed = isnan(stall_anchor_target) ||
                fabsf(target_counts - stall_anchor_target) >= ${dial_stall_min_counts};
            if (!stall_was_moving || isnan(stall_anchor_error) || target_changed) {
              stall_was_moving = true;
              stall_anchor_error = error;
              stall_anchor_target = target_counts;
              stall_anchor_ms = millis();
            } else if (stall_anchor_error - error >= ${dial_stall_min_counts}) {
              stall_anchor_error = error;
              stall_anchor_ms = millis();
            } else if (millis() - stall_anchor_ms >= ${dial_stall_timeout_ms}) {
              id(dial_motor).set_target(id(dial_motor).current_position);
              id(dial_motor_enable).turn_off();
              id(dial_needs_cal) = true;
              ESP_LOGE("dial", "STALL/WRONG DIRECTION: target error did not shrink by %.1f counts in %ums (%.1f -> %.1f) - coils disabled",
                       (float) ${dial_stall_min_counts}, (unsigned) ${dial_stall_timeout_ms}, stall_anchor_error, error);
              return;
            }
          }

          if (id(standby_mode)) {
            // Track only in standby — but let a running park move finish first
            if (id(dial_motor).has_reached_target()) id(dial_motor_enable).turn_off();
            return;
          }
          if (outside_guard || !id(dial_motor).has_reached_target()) {
            // a commanded move (dial_goto) is still running — leave it alone
          } else {
            id(dial_motor_enable).turn_off();
          }

  # Dial summary: evaluated once per second, but emitted only when a meaningful
  # value or state changes. Slow movement accumulates against the last logged
  # position, so it is still reported without idle log spam.
  - interval: 1s
    then:
      - lambda: |-
          float lo = id(dial_min) + ${dial_guard};
          float hi = id(dial_max) - ${dial_guard};
          float pct = (lo < hi) ? (hi - id(dial_pos)) / (hi - lo) * 100.0f : NAN;
          uint32_t encoder_age = millis() - id(encoder_last_ok);
          bool encoder_ok = encoder_age <= 1000;
          bool coils = id(dial_motor_enable).state;
          bool reached = id(dial_motor).has_reached_target();

          static float last_pos = NAN;
          static float last_min = NAN;
          static float last_max = NAN;
          static int last_dir = 0;
          static int last_stage = -1;
          static bool last_needs_cal = false;
          static bool last_standby = false;
          static bool last_estop = false;
          static bool last_wd_bypass = false;
          static bool last_encoder_ok = false;
          static bool last_coils = false;
          static bool last_reached = false;

          bool first = isnan(last_pos);
          bool changed = first ||
              fabsf(id(dial_pos) - last_pos) >= 10.0f ||
              isnan(last_min) || fabsf(id(dial_min) - last_min) >= 1.0f ||
              isnan(last_max) || fabsf(id(dial_max) - last_max) >= 1.0f ||
              id(dial_dir) != last_dir ||
              id(cal_stage) != last_stage ||
              id(dial_needs_cal) != last_needs_cal ||
              id(standby_mode) != last_standby ||
              id(dial_estop) != last_estop ||
              id(dial_watchdog_bypass) != last_wd_bypass ||
              encoder_ok != last_encoder_ok ||
              coils != last_coils || reached != last_reached;
          if (!changed) return;

          last_pos = id(dial_pos);
          last_min = id(dial_min);
          last_max = id(dial_max);
          last_dir = id(dial_dir);
          last_stage = id(cal_stage);
          last_needs_cal = id(dial_needs_cal);
          last_standby = id(standby_mode);
          last_estop = id(dial_estop);
          last_wd_bypass = id(dial_watchdog_bypass);
          last_encoder_ok = encoder_ok;
          last_coils = coils;
          last_reached = reached;

          ESP_LOGI("dial-dbg", "raw=%.0f pos=%.0f pct=%.1f%% dir=%+d lim=[%.0f,%.0f] cal=%s stage=%d standby=%s estop=%s wd_bypass=%s enc_age=%ums coils=%s tgt=%s",
                   id(dial_last_raw), id(dial_pos), pct, id(dial_dir),
                   id(dial_min), id(dial_max),
                   id(dial_needs_cal) ? "NEEDED" : "ok",
                   id(cal_stage),
                   id(standby_mode) ? "ON" : "off",
                   id(dial_estop) ? "LATCHED" : "off",
                   id(dial_watchdog_bypass) ? "ON" : "off",
                   (unsigned) encoder_age,
                   coils ? "ON" : "off",
                   reached ? "reached" : "moving");

  # LED 5 is the calibration warning: blink whenever motion is locked because
  # calibration is missing or incomplete. Standby owns all LEDs and keeps it
  # off; successful MAX capture explicitly restores the normal steady state.
  # One-second phases are deliberately slow enough to remain obvious through
  # the front-panel diffuser and any capacitance in the LED driver wiring.
  - interval: 1s
    then:
      - lambda: |-
          if (id(standby_mode) || id(leds_dimmed)) return;
          if (id(dial_needs_cal) || id(cal_stage) != 0)
            id(radiola_led_5).toggle().perform();

  # Snap-to-station: once the hand-turned dial settles near a station,
  # gently pull the pointer to dead center (radio mode only)
  - interval: 250ms
    then:
      - lambda: |-
          if (!id(radio_mode) || id(standby_mode) || id(dial_needs_cal) || id(cal_stage) != 0) return;
          if (!id(dial_motor).has_reached_target()) return;      // a move is running
          if (millis() - id(dial_last_move) < 600) return;       // still being turned
          float lo = id(dial_min) + ${dial_guard};
          float hi = id(dial_max) - ${dial_guard};
          if (lo >= hi) return;
          float pct = (hi - id(dial_pos)) / (hi - lo) * 100.0f;
          const float stations[4] = {${station_1_pct}, ${station_2_pct}, ${station_3_pct}, ${station_4_pct}};
          for (float s : stations) {
            float off = fabsf(pct - s);
            if (off <= ${snap_capture_pct} && off > ${snap_deadband_pct}) {
              ESP_LOGI("dial", "Snap: %.1f%% -> station at %.0f%%", pct, s);
              id(dial_goto_pct)->execute(s);
              break;
            }
          }

# --- DIAL MOTOR MOVES (always clamped to the soft endstops) ---
script:
  # All real front-panel activity comes through here. Physical standby remains
  # authoritative; while active, activity refreshes the idle timer and re-lights
  # the LEDs if the idle dimmer has turned them off.
  - id: register_activity
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(standby_mode);'
          then:
            - lambda: 'id(last_user_activity) = millis();'
            - if:
                condition:
                  lambda: 'return id(leds_dimmed);'
                then:
                  - lambda: |-
                      id(leds_dimmed) = false;
                      ESP_LOGI("radiola", "AUTO DIM: activity - LEDs back on");
                  - light.turn_on: radiola_led_1
                  - light.turn_on: radiola_led_2
                  - light.turn_on: radiola_led_3
                  - light.turn_on: radiola_led_4
                  - light.turn_on: radiola_led_5

  - id: dial_goto
    mode: restart
    parameters:
      target_counts: float
    then:
      - lambda: |-
          if (id(dial_estop)) {
            ESP_LOGW("dial", "MOVE LOCKED: emergency stop is latched; press Clear Emergency Stop");
            return;
          }
          if (id(dial_needs_cal)) {
            ESP_LOGW("dial", "MOVE LOCKED: calibration is required; capture MIN then MAX stop");
            return;
          }
          if (id(cal_stage) != 0) {
            ESP_LOGW("dial", "MOVE LOCKED: calibration stage %d is incomplete; capture the other stop", id(cal_stage));
            return;
          }
          if (id(standby_mode)) {
            ESP_LOGW("dial", "MOVE LOCKED: standby is ON; ground GPIO4 / release the standby plate");
            return;
          }
          const float CPS = ${dial_counts_per_step};
          float lo = id(dial_min) + ${dial_guard};
          float hi = id(dial_max) - ${dial_guard};
          if (lo >= hi || fabsf(CPS) < 0.001f) {
            id(dial_motor).set_target(id(dial_motor).current_position);
            id(dial_motor_enable).turn_off();
            id(dial_needs_cal) = true;
            ESP_LOGE("dial", "Invalid usable span or counts-per-step - refusing motor move");
            return;
          }
          float t = target_counts;
          if (t < lo) t = lo;
          if (t > hi) t = hi;
          if (fabsf(t - target_counts) > 0.5f) {
            ESP_LOGW("dial", "Requested target %.0f clamped to safe target %.0f within [%.0f, %.0f]",
                     target_counts, t, lo, hi);
          }
          id(dial_motor_enable).turn_on();
          id(dial_motor).report_position((int32_t) (id(dial_pos) / CPS));
          id(dial_motor).set_target((int32_t) (t / CPS));

  # Move to a % of the usable span (0 = left limit+guard, 100 = right limit-guard)
  - id: dial_goto_pct
    mode: restart
    parameters:
      pct: float
    then:
      - lambda: |-
          float lo = id(dial_min) + ${dial_guard};
          float hi = id(dial_max) - ${dial_guard};
          if (lo >= hi) return;
          float p = pct;
          if (p < 0.0f) p = 0.0f;
          if (p > 100.0f) p = 100.0f;
          id(dial_goto)->execute(hi - (p / 100.0f) * (hi - lo));

  # Seek: sweep to the next station rightward (wrap to first), static hissing
  # during the sweep like a real band scan
  - id: dial_seek
    mode: single
    then:
      - lambda: |-
          float lo = id(dial_min) + ${dial_guard};
          float hi = id(dial_max) - ${dial_guard};
          if (lo >= hi) return;
          float pct = (hi - id(dial_pos)) / (hi - lo) * 100.0f;
          const float stations[4] = {${station_1_pct}, ${station_2_pct}, ${station_3_pct}, ${station_4_pct}};
          float next = stations[0];
          for (float s : stations) {
            if (s > pct + 2.0f) { next = s; break; }
          }
          ESP_LOGI("dial", "Seek: %.1f%% -> station at %.0f%%", pct, next);
          id(dial_goto_pct)->execute(next);
      - dfplayer.set_volume: ${static_volume}
      - dfplayer.play_folder:
          folder: 1
          file: 1  # static
      - wait_until:
          condition:
            lambda: 'return id(dial_motor).has_reached_target();'
          timeout: 20s
      - dfplayer.stop:

  # Park the pointer at the left end on standby (bypasses the standby guard
  # in dial_goto — the 5V rail is still up at this point in the shutdown)
  - id: dial_park
    mode: restart
    then:
      - lambda: |-
          if (id(dial_needs_cal) || id(cal_stage) != 0 || id(dial_estop)) return;
          float lo = id(dial_min) + ${dial_guard};
          float hi = id(dial_max) - ${dial_guard};
          if (lo >= hi) return;
          const float CPS = ${dial_counts_per_step};
          ESP_LOGI("dial", "Parking pointer at left end");
          id(dial_motor_enable).turn_on();
          id(dial_motor).report_position((int32_t) (id(dial_pos) / CPS));
          id(dial_motor).set_target((int32_t) (hi / CPS));

  # Diagnostic bypass is deliberately self-cancelling. It is only for probing
  # the DRV8825 control pins with the motor disconnected.
  - id: dial_diagnostic_timeout
    mode: restart
    then:
      - delay: 60s
      - lambda: |-
          id(dial_watchdog_bypass) = false;
          id(dial_motor).set_target(id(dial_motor).current_position);
          id(dial_motor_enable).turn_off();
          ESP_LOGW("dial-dbg", "Diagnostic bypass timed out - watchdog restored and ENABLE forced HIGH");

  # Start every static/noise segment at the fixed DFPlayer level.
  - id: start_radio_static
    mode: restart
    then:
      - dfplayer.set_volume: ${static_volume}
      - dfplayer.play_folder:
          folder: 1
          file: 1

  # The front-panel Radio/LP keys are mechanically latching. Keep their mode
  # actions in scripts so the same selection can be applied on a button edge,
  # from the initial pin state at boot, and again after leaving standby.
  - id: enter_radio_mode
    mode: restart
    then:
      - script.execute: register_activity
      - lambda: |-
          id(radio_mode) = true;
          id(lp_mode) = false;
          // Suppress the dial's repeated current-state callback while the
          // spoken Radio cue plays. A real dial movement still interrupts it.
          id(last_dial_mode) = id(dial_mode).state;
          ESP_LOGI("radiola", "RADIO MODE: ON (GPIO18)");
      - if:
          condition:
            lambda: |-
              return !id(standby_mode) && !id(dial_needs_cal) &&
                     id(cal_stage) == 0 && id(dial_mode).state == "noise";
          then:
            # Mark noise as handled so the dial callback does not interrupt
            # the spoken mode cue. on_finished_playback starts static afterward.
            - logger.log: "Radio mode entered between stations - static will follow the mode cue"
            - lambda: 'id(last_dial_mode) = "noise";'
          else:
            - dfplayer.stop:
      - logger.log: "Radio mode selected - playing 005.wav"
      - dfplayer.set_volume: 30
      - dfplayer.play_folder:
          folder: 1
          file: 5

  - id: enter_lp_mode
    mode: restart
    then:
      - script.execute: register_activity
      - lambda: |-
          id(radio_mode) = false;
          id(lp_mode) = true;
          id(last_dial_mode) = "unknown";
          ESP_LOGI("radiola", "LP MODE: ON (GPIO19)");
      - dfplayer.stop:
      - logger.log: "Vinyl mode selected - playing 006.wav"
      - dfplayer.set_volume: 30
      - dfplayer.play_folder:
          folder: 1
          file: 6

  # One restartable transition prevents delayed actions from an old standby
  # event racing a newer wake event (or vice versa).
  - id: standby_transition
    mode: restart
    parameters:
      entering: bool
    then:
      - if:
          condition:
            lambda: 'return entering;'
          then:
            - dfplayer.set_volume: 30
            - dfplayer.play_folder:
                folder: 1
                file: 4  # 004.wav shutdown sound
            - light.turn_off: radiola_led_5
            - delay: 300ms
            - light.turn_off: radiola_led_4
            - delay: 300ms
            - light.turn_off: radiola_led_3
            - delay: 300ms
            - light.turn_off: radiola_led_2
            - delay: 300ms
            - light.turn_off: radiola_led_1
            - homeassistant.service:
                service: media_player.media_stop
                data:
                  entity_id: media_player.kitchen
            - script.execute: dial_park
            - delay: 2500ms
            - wait_until:
                condition:
                  lambda: 'return id(dial_motor).has_reached_target();'
                timeout: 10s
            - switch.turn_off: dial_motor_enable
            - switch.turn_off: radiola_power
            - lambda: 'global_preferences->sync();'
            - logger.log: "Entering standby — LEDs off, power rail off, audio stopped"
          else:
            # A park move runs as its own script, so cancel it explicitly when
            # a pending shutdown is superseded by wake.
            - script.stop: dial_park
            - lambda: 'id(dial_motor).set_target(id(dial_motor).current_position);'
            - switch.turn_off: dial_motor_enable
            - switch.turn_on: radiola_power
            - delay: 500ms
            - dfplayer.set_volume: 30
            - dfplayer.play_folder:
                folder: 1
                file: 2
            - light.turn_on: radiola_led_1
            - delay: 300ms
            - light.turn_on: radiola_led_2
            - delay: 300ms
            - light.turn_on: radiola_led_3
            - delay: 300ms
            - light.turn_on: radiola_led_4
            - delay: 300ms
            - light.turn_on: radiola_led_5
            - delay: 400ms
            - light.turn_off: radiola_led_1
            - light.turn_off: radiola_led_2
            - light.turn_off: radiola_led_3
            - light.turn_off: radiola_led_4
            - light.turn_off: radiola_led_5
            - delay: 400ms
            - light.turn_on: radiola_led_1
            - light.turn_on: radiola_led_2
            - light.turn_on: radiola_led_3
            - light.turn_on: radiola_led_4
            - light.turn_on: radiola_led_5
            # Restore whichever mechanically latched mode key is currently
            # down, and only resume Sonos when a real playback mode is active.
            # Radio wins if an invalid state reports both keys active.
            - if:
                condition:
                  binary_sensor.is_on: radio_mode_button
                then:
                  - script.execute: enter_radio_mode
                  - homeassistant.service:
                      service: media_player.media_play
                      data:
                        entity_id: media_player.kitchen
                else:
                  - if:
                      condition:
                        binary_sensor.is_on: lp_mode_button
                      then:
                        - script.execute: enter_lp_mode
                        - homeassistant.service:
                            service: media_player.media_play
                            data:
                              entity_id: media_player.kitchen
            - logger.log: "Waking from standby — power rail on, LEDs on, selected mode restored"

# --- LP ALBUM PROGRESS (fed by a Home Assistant automation) ---
# HA writes 0-100 from the Sonos media position; in LP mode the pointer
# tracks across the dial like a stylus over the record
number:
  - platform: template
    name: "LP Progress"
    id: lp_progress
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: 'return id(lp_mode) && !id(standby_mode) && !id(dial_needs_cal);'
          then:
            - script.execute:
                id: dial_goto_pct
                pct: !lambda 'return x;'

# --- MODE DETECTION ---
text_sensor:
  - platform: template
    name: "Radiola Standby State"
    id: standby_state
    update_interval: 1s
    lambda: |-
      return id(standby_mode) ? std::string("on") : std::string("off");

  # Overall mode for the HA card: standby / radio / lp / idle
  - platform: template
    name: "Radiola Mode"
    id: radiola_mode
    update_interval: 500ms
    lambda: |-
      if (id(standby_mode)) return {"standby"};
      if (id(radio_mode)) return {"radio"};
      if (id(lp_mode)) return {"lp"};
      return {"idle"};
    on_value:
      then:
        # The template republishes every 500 ms. Rearm the cleanup outside
        # idle, but execute it only once on the next transition into idle.
        - if:
            condition:
              lambda: 'return x != "idle";'
            then:
              - lambda: 'id(idle_audio_stopped) = false;'
        - if:
            condition:
              lambda: 'return x == "idle" && !id(idle_audio_stopped);'
            then:
              - lambda: 'id(idle_audio_stopped) = true;'
              - logger.log: "IDLE MODE: stopping DFPlayer and Home Assistant audio"
              - dfplayer.stop:
              - homeassistant.service:
                  service: media_player.media_stop
                  data:
                    entity_id: media_player.kitchen
              # Do not leave Sonos muted if idle was entered from tuning noise.
              - homeassistant.service:
                  service: media_player.volume_mute
                  data:
                    entity_id: media_player.kitchen
                    is_volume_muted: "false"
              - homeassistant.service:
                  service: input_text.set_value
                  data:
                    entity_id: input_text.radiola_preloaded_playlist
                    value: ""

  # Station detection from the encoder (same capture zone as snap-to-station,
  # so "on a station" and "will snap to it" always agree)
  - platform: template
    name: "Dial Mode"
    id: dial_mode
    update_interval: 250ms
    lambda: |-
      if (id(dial_needs_cal) || id(cal_stage) != 0) return {"unknown"};
      float lo = id(dial_min) + ${dial_guard};
      float hi = id(dial_max) - ${dial_guard};
      if (lo >= hi) return {"unknown"};
      float p = (hi - id(dial_pos)) / (hi - lo) * 100.0f;
      const float tol = ${snap_capture_pct};
      if (fabsf(p - ${station_1_pct}) <= tol) return {"station_1"};
      if (fabsf(p - ${station_2_pct}) <= tol) return {"station_2"};
      if (fabsf(p - ${station_3_pct}) <= tol) return {"station_3"};
      if (fabsf(p - ${station_4_pct}) <= tol) return {"station_4"};
      return {"noise"};
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(radio_mode) && x != id(last_dial_mode);'
            then:
              - lambda: 'id(last_dial_mode) = x;'
              - if:
                  condition:
                    lambda: 'return x == "noise";'
                  then:
                    - logger.log: "Dial entered noise - starting static"
                    # Start immediately at the constant boosted static level.
                    - script.execute: start_radio_static
                  else:
                    - logger.log: "Dial left noise - stopping static"
                    - dfplayer.stop:

  # Preload prediction: while tuning through noise, name the station we're
  # heading toward so HA can start its playlist muted before we arrive.
  # "none" = nothing to preload (on a station, past the last one, etc.)
  - platform: template
    name: "Radiola Preload Station"
    id: preload_station
    update_interval: 250ms
    lambda: |-
      if (!id(radio_mode) || id(standby_mode) || id(dial_needs_cal) || id(cal_stage) != 0)
        return {"none"};
      if (id(dial_mode).state != "noise") return {"none"};
      float lo = id(dial_min) + ${dial_guard};
      float hi = id(dial_max) - ${dial_guard};
      if (lo >= hi) return {"none"};
      float p = (hi - id(dial_pos)) / (hi - lo) * 100.0f;
      const float st[4] = {${station_1_pct}, ${station_2_pct}, ${station_3_pct}, ${station_4_pct}};
      int target = -1;
      // Percentage direction is opposite the raw encoder direction because
      // counts increase toward the physical left.
      if (id(dial_dir) < 0) {
        for (int i = 0; i < 4; i++) if (st[i] > p) { target = i; break; }
      } else {
        for (int i = 3; i >= 0; i--) if (st[i] < p) { target = i; break; }
      }
      if (target < 0) return {"none"};
      char buf[12];
      snprintf(buf, sizeof(buf), "station_%d", target + 1);
      return {std::string(buf)};

  # Why the ESP last rebooted — the key diagnostic for calibration loss
  # (e.g. "Brownout reset", "Software reset", "Power on reset").
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic

# --- TEST BUTTONS ---
button:
  - platform: template
    name: "Test Play DFPlayer File"
    on_press:
      - logger.log: "Test button pressed - playing file 1 from folder 1"
      - dfplayer.set_volume: 30
      - dfplayer.play_folder:
          folder: 1
          file: 1

  - platform: template
    name: "Test DFPlayer 003.wav"
    entity_category: diagnostic
    on_press:
      - logger.log: "DFPlayer test: playing folder 01 / 003.wav"
      - dfplayer.set_volume: 30
      - dfplayer.play_folder:
          folder: 1
          file: 3

  - platform: template
    name: "Test DFPlayer 005.wav"
    entity_category: diagnostic
    on_press:
      - logger.log: "DFPlayer test: playing folder 01 / 005.wav"
      - dfplayer.set_volume: 30
      - dfplayer.play_folder:
          folder: 1
          file: 5

  - platform: template
    name: "Test DFPlayer 006.wav"
    entity_category: diagnostic
    on_press:
      - logger.log: "DFPlayer test: playing folder 01 / 006.wav"
      - dfplayer.set_volume: 30
      - dfplayer.play_folder:
          folder: 1
          file: 6

  - platform: template
    name: "Stop DFPlayer"
    on_press:
      - logger.log: "Stopping DFPlayer playback"
      - dfplayer.stop:

  - platform: template
    name: "DFPlayer Volume Up"
    on_press:
      - dfplayer.set_volume: 30
      - logger.log: "Volume set to 30"

  - platform: template
    name: "DFPlayer Volume Down"
    on_press:
      - dfplayer.set_volume: 10
      - logger.log: "Volume set to 10"

  - platform: template
    name: "Toggle Radiola Power"
    on_press:
      - switch.toggle: radiola_power

  # --- BRING-UP: guarded jogs. They remain inside the calibrated soft limits
  # and use the normal encoder watchdog and automatic coil release.
  - platform: template
    name: "Dial Diagnostic Disable Watchdog 60s"
    icon: "mdi:timer-alert-outline"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(dial_watchdog_bypass) = true;
          ESP_LOGW("dial-dbg", "WATCHDOG BYPASS active for 60 seconds - bench testing only");
      - script.execute: dial_diagnostic_timeout

  - platform: template
    name: "Dial Diagnostic Restore Watchdog"
    icon: "mdi:shield-check"
    entity_category: diagnostic
    on_press:
      - script.stop: dial_diagnostic_timeout
      - lambda: |-
          id(dial_watchdog_bypass) = false;
          id(dial_motor).set_target(id(dial_motor).current_position);
          id(dial_motor_enable).turn_off();
          ESP_LOGI("dial-dbg", "Watchdog restored - ENABLE forced HIGH");

  - platform: template
    name: "Dial Diagnostic Force ENABLE HIGH"
    icon: "mdi:electric-switch-closed"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(dial_motor).set_target(id(dial_motor).current_position);
          id(dial_motor_enable).turn_off();
          ESP_LOGI("dial-dbg", "DRV8825 ENABLE forced HIGH (driver outputs disabled)");

  - platform: template
    name: "Dial Diagnostic Force ENABLE LOW"
    icon: "mdi:alert"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (!id(dial_watchdog_bypass)) {
            ESP_LOGW("dial-dbg", "ENABLE LOW refused: activate the 60-second watchdog bypass first");
            return;
          }
          if (id(dial_estop)) {
            ESP_LOGW("dial-dbg", "ENABLE LOW refused: emergency stop is latched");
            return;
          }
          id(dial_motor_enable).turn_on();
          ESP_LOGW("dial-dbg", "DRV8825 ENABLE forced LOW - output stage enabled until HIGH, restore, emergency stop or timeout");

  - platform: template
    name: "Dial Motor Emergency Stop"
    icon: "mdi:stop-circle"
    entity_category: diagnostic
    on_press:
      - script.stop: dial_seek
      - script.stop: dial_park
      - lambda: |-
          id(dial_estop) = true;
          id(dial_motor).set_target(id(dial_motor).current_position);
          id(dial_motor_enable).turn_off();
          ESP_LOGW("dial-dbg", "Motor emergency stop LATCHED - target cancelled and coils disabled");

  - platform: template
    name: "Dial Motor Clear Emergency Stop"
    icon: "mdi:restart-alert"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (id(dial_needs_cal) || id(cal_stage) != 0 || id(standby_mode)) {
            ESP_LOGW("dial-dbg", "Emergency stop remains latched: cal_needed=%s stage=%d standby=%s",
                     id(dial_needs_cal) ? "yes" : "no", id(cal_stage), id(standby_mode) ? "ON" : "off");
            return;
          }
          id(dial_estop) = false;
          ESP_LOGI("dial-dbg", "Motor emergency stop cleared");

  # Home Assistant alternative to the physical-button calibration sequence.
  # Move the dial by hand to one stop, capture MIN, then move to the other
  # stop and capture MAX. The numerical endpoints are sorted automatically.
  - platform: template
    name: "Dial Calibration Capture MIN Stop"
    icon: "mdi:arrow-collapse-left"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (id(encoder_last_ok) == 0 || millis() - id(encoder_last_ok) > 1000) {
            ESP_LOGE("dial", "Cannot capture MIN stop: no recent encoder reading");
            return;
          }
          id(dial_motor).set_target(id(dial_motor).current_position);
          id(dial_motor_enable).turn_off();
          id(dial_needs_cal) = true;
          id(dial_min) = id(dial_pos);
          id(cal_stage) = 2;
          ESP_LOGI("dial", "HA CAL: first stop captured at %.0f. Move by hand to the other stop and press Capture MAX Stop", id(dial_min));

  - platform: template
    name: "Dial Calibration Capture MAX Stop"
    icon: "mdi:arrow-collapse-right"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (id(cal_stage) != 2) {
            ESP_LOGW("dial", "Capture MIN Stop before Capture MAX Stop");
            return;
          }
          if (id(encoder_last_ok) == 0 || millis() - id(encoder_last_ok) > 1000) {
            ESP_LOGE("dial", "Cannot capture MAX stop: no recent encoder reading");
            return;
          }
          float a = id(dial_min);
          float b = id(dial_pos);
          const float required = 2.0f * ${dial_guard} + ${dial_min_usable_span};
          const float CPS = ${dial_counts_per_step};
          float span = fabsf(b - a);
          if (fabsf(CPS) < 0.001f) {
            ESP_LOGE("dial", "HA CAL rejected: dial_counts_per_step must be non-zero");
            return;
          }
          if (span < required) {
            ESP_LOGE("dial", "HA CAL rejected: span %.0f is too small; need at least %.0f counts", span, required);
            return;
          }
          id(dial_min) = std::min(a, b);
          id(dial_max) = std::max(a, b);
          id(cal_stage) = 0;
          id(dial_needs_cal) = false;
          id(dial_last_move) = millis();
          id(dial_motor).report_position((int32_t) (id(dial_pos) / CPS));
          id(dial_motor).set_target(id(dial_motor).current_position);
          id(dial_motor_enable).turn_off();
          // The MAX-calibration indicator may be on either half of its blink
          // cycle here. Restore the normal steady LED state explicitly.
          if (!id(standby_mode)) id(radiola_led_5).turn_on().perform();
          global_preferences->sync();
          ESP_LOGI("dial", "HA CAL complete: limits [%.0f, %.0f], span %.0f saved to flash", id(dial_min), id(dial_max), span);

  - platform: template
    name: "Dial Test +10 Steps"
    icon: "mdi:step-forward"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          ESP_LOGI("dial-dbg", "Test +10 requested");
          id(dial_goto)->execute(id(dial_pos) + 10.0f * (float) ${dial_counts_per_step});

  - platform: template
    name: "Dial Test -10 Steps"
